{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'products/css/products.css' %}">
{% endblock %}

{% block content %}

<div class="container-fluid page-header d-flex align-items-end px-4 pb-3">
    <div class="row">
        <div class="col-12 text-start">
            <h1>Add a New Product</h1>
        </div>
    </div>
</div>

<div class="add-product-container container-fluid mt-5 px-md-5 px-1 fade-in-element"> 
    <div class="row justify-content-center g-4">
        
        <div class="col-12 col-lg-10 px-3">
            {% crispy form %}
        </div>
    </div>
</div>

{% endblock %}

{% block postloadjs %}
<script src="{% static 'products/js/products.js' %}"></script>    
{% endblock %}

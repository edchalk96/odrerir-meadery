{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="container-fluid page-header d-flex align-items-end px-4 pb-3">
    <div class="row">
        <div class="col-12 text-start">
            <h1>404 — Page Not Found</h1>
        </div>
    </div>
</div>

<div style="min-height: 35vh;" class="error-container container-fluid d-flex flex-column justify-content-center align-items-center text-center px-3 px-md-5 my-auto py-5 fade-in-element"> 
    <div class="row justify-content-center w-100">
        <div class="col-12 col-md-8 col-lg-6">
            <p class="mb-2">We couldn't find the page you were looking for.</p>
            <p class="mb-4">The link you followed may be broken, or the page may have been moved or removed.</p>
            <a class="btn px-4" href="{% url 'home' %}"><i class="fa-solid fa-house me-2"></i>Return to Home Page</a>
        </div>
    </div>
</div>

{% endblock %}

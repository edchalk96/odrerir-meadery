{% extends "account/base.html" %}
{% load static %}
{% load i18n %}
{% load allauth account %}

{% block head_title %}{% trans "Sign Out" %}{% endblock head_title %}

{% block inner_content %}

<div class="container-fluid page-header d-flex align-items-end px-4 pb-3">
    <div class="row">
        <div class="col-12 text-start">
            <h1>Log Out</h1>
        </div>
    </div>
</div>

<div class="container text-center account-content fade-in-element">
    <div class="row justify-content-center mt-4 mt-md-3 mt-lg-4">
        <div class="col-md-8">
            <form class="logout" action="{% url 'account_logout' %}" method="post">
                {% csrf_token %}
                {% if redirect_field_value %}
                <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
                {% endif %}
                <button class="btn btn-signup" type="submit">{% trans "Log Out" %}</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
